name: M4.40 frozen actor score geometry audit
on:
  pull_request:
    paths:
      - 'src/mahtrain_core/ai_shadow_score_geometry.py'
      - 'examples/audit_frozen_score_geometry.py'
      - 'tests/test_m440_frozen_score_geometry.py'
      - 'docs/MATCH_M440_FROZEN_SCORE_GEOMETRY_V1.50.md'
      - '.github/workflows/m440-frozen-feature-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src/mahtrain_core/ai_shadow_score_geometry.py'
permissions:
  contents: read
jobs:
  exact-frozen-margins:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Verify exact replay-free frozen feature margins
        run: python -W error::SyntaxWarning -m unittest discover -s tests -p 'test_m440_frozen_score_geometry.py' -v
      - name: Compile source and CLI
        run: python -W error::SyntaxWarning -m py_compile src/mahtrain_core/ai_shadow_score_geometry.py examples/audit_frozen_score_geometry.py
      - name: CLI help
        run: python examples/audit_frozen_score_geometry.py --help

name: M4.46 frozen M4.45 peng twenty independent-shuffle expansion
on:
  pull_request:
    paths:
      - 'src/mahtrain_core/ai_pong_independent_expansion.py'
      - 'examples/run_pong_independent_expansion.py'
      - 'tests/test_m446_pong_independent_expansion.py'
      - '.github/workflows/m446-independent-pong-expansion.yml'
  push:
    branches: [main]
    paths:
      - 'src/mahtrain_core/ai_pong_independent_expansion.py'
permissions:
  contents: read
jobs:
  frozen-twenty-seed-paid-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Source-frozen, independent seeds, 100-game mocked paid contract
        run: python -W error::SyntaxWarning -m unittest discover -s tests -p 'test_m446_pong_independent_expansion.py' -v
      - name: Compile and CLI arguments
        run: python -W error::SyntaxWarning -m py_compile src/mahtrain_core/ai_pong_independent_expansion.py examples/run_pong_independent_expansion.py
      - name: CLI usage
        run: python examples/run_pong_independent_expansion.py --help

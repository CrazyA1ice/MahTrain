name: M4.47 first natural Challenge pass peng paired end-to-end branches
on:
  pull_request:
    paths:
      - 'src/mahtrain_core/ai_pong_pass_branch_rollouts.py'
      - 'examples/run_pong_pass_branch_rollouts.py'
      - 'tests/test_m447_pong_pass_branch_rollouts.py'
      - '.github/workflows/m447-pong-pass-branch-rollouts.yml'
  push:
    branches: [main]
    paths:
      - 'src/mahtrain_core/ai_pong_pass_branch_rollouts.py'
permissions:
  contents: read
jobs:
  genuine-pong-pass-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Actor-visible first pass/peng replay exact original baseline and official paid branch
        run: python -W error::SyntaxWarning -m unittest discover -s tests -p 'test_m447_pong_pass_branch_rollouts.py' -v
      - name: Compile new research code and Windows CLI
        run: python -W error::SyntaxWarning -m py_compile src/mahtrain_core/ai_pong_pass_branch_rollouts.py examples/run_pong_pass_branch_rollouts.py
      - name: CLI help
        run: python examples/run_pong_pass_branch_rollouts.py --help

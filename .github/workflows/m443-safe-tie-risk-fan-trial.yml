name: M4.43 fresh-seed safe-tie risk and fan official game trial
on:
  pull_request:
    paths:
      - 'src/mahtrain_core/ai_safe_tie_policy_trial.py'
      - 'examples/run_safe_tie_risk_fan_trial.py'
      - 'tests/test_m443_safe_tie_policy_trial.py'
      - 'tests/test_m436_frozen_shadow_four_seat.py'
      - '.github/workflows/m443-safe-tie-risk-fan-trial.yml'
  push:
    branches: [main]
    paths:
      - 'src/mahtrain_core/ai_safe_tie_policy_trial.py'
permissions:
  contents: read
jobs:
  no-retreat-paid-seed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Fresh seed paid ledger and safe own-view tie restrictions
        run: python -W error::SyntaxWarning -m unittest discover -s tests -p 'test_m443_safe_tie_policy_trial.py' -v
      - name: Compile module and Windows CLI
        run: python -W error::SyntaxWarning -m py_compile src/mahtrain_core/ai_safe_tie_policy_trial.py examples/run_safe_tie_risk_fan_trial.py
      - name: CLI usage
        run: python examples/run_safe_tie_risk_fan_trial.py --help

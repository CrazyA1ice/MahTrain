name: Queju 3D Mahjong client integration
on:
  push:
    branches:
      - feat/m367-vendor-queju-3d-client
    paths:
      - "frontend_3d/**"
      - "web_server.py"
      - "web/index.html"
      - "tests/test_web_app.py"
      - ".github/workflows/queju-3d.yml"
  pull_request:
    paths:
      - "frontend_3d/**"
      - "web_server.py"
      - "web/index.html"
      - "tests/test_web_app.py"
      - ".github/workflows/queju-3d.yml"
permissions:
  contents: write
jobs:
  third-party-client-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real 3D client dependencies
        run: cd frontend_3d && npm install --no-audit --no-fund
      - name: Test MahTrain to Queju state/action boundary
        run: cd frontend_3d && npm run test:bridge
      - name: Compile original Queju 3D WebGL frontend
        run: cd frontend_3d && npm run build
      - name: Verify built page is served from Python without source access
        run: |
          python - <<'PY'
          import web_server
          from pathlib import Path
          import html
          entry=web_server._asset_path('/3d/game.html')
          assert entry.is_file(),entry
          body=entry.read_text(encoding='utf-8')
          assert '<canvas' in body or 'id="app"' in body
          assert '/3d/assets/' in body
          for path in ['/3d/assets/../secret','/3d/node_modules/a','/frontend_3d/public/src/main.ts']:
              assert web_server._asset_path(path) is None,path
          print('MahTrain secure static mapping / 3D compiled entry PASS')
          PY
      - name: Real Chromium 3D browser smoke and Mahjong actions
        run: |
          if ! command -v google-chrome >/dev/null 2>&1 \
            && ! command -v chromium >/dev/null 2>&1 \
            && ! command -v chromium-browser >/dev/null 2>&1; then
            (cd frontend_3d && npx playwright install --with-deps chromium)
          fi
          export MAHTRAIN_HISTORY_DB=/tmp/mahtrain_3d_smoke.sqlite3
          export MAHTRAIN_MATCH_DB=/tmp/mahtrain_3d_smoke.sqlite3
          python web_server.py >/tmp/mahtrain_3d_server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for i in range(90):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/3d/game.html',timeout=1) as r:
                      assert r.status==200
                      break
              except Exception:
                  time.sleep(.25)
          else:
              raise RuntimeError('3D Python server did not start')
          PY
          node frontend_3d/test/3d-browser-smoke.mjs
      - name: Archive actual 3D browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahtrain-queju-3d-live-browser
          path: frontend_3d/test-artifacts/
          if-no-files-found: warn
      - name: Commit real built client to feature branch
        if: github.event_name == 'push' && github.ref_name == 'feat/m367-vendor-queju-3d-client'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f frontend_3d/dist/
          if ! git diff --cached --quiet; then
            git commit -m 'build(M3.67): publish compiled Queju 3D client assets'
            git push origin HEAD:feat/m367-vendor-queju-3d-client
          fi
      - name: Upload real compiled client for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mahtrain-queju-3d-dist
          path: frontend_3d/dist/
          retention-days: 7

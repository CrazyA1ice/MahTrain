name: M4.42 Challenge safe-tie opportunity audit on fresh shuffles
on:
  pull_request:
    paths:
      - 'src/mahtrain_core/ai_challenge_tie_opportunities.py'
      - 'examples/run_challenge_tie_opportunity_probe.py'
      - 'tests/test_m442_challenge_tie_opportunities.py'
      - 'tests/test_m436_frozen_shadow_four_seat.py'
      - '.github/workflows/m442-challenge-tie-probe.yml'
  push:
    branches: [main]
    paths:
      - 'src/mahtrain_core/ai_challenge_tie_opportunities.py'
permissions:
  contents: read
jobs:
  legal-same-ukeire-choice-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Fresh-seed safe tie counts and evidence invariants
        run: python -W error::SyntaxWarning -m unittest discover -s tests -p 'test_m442_challenge_tie_opportunities.py' -v
      - name: Compile new standalone CLI and audit
        run: python -W error::SyntaxWarning -m py_compile src/mahtrain_core/ai_challenge_tie_opportunities.py examples/run_challenge_tie_opportunity_probe.py
      - name: CLI help
        run: python examples/run_challenge_tie_opportunity_probe.py --help

name: Sichuan Rules Kernel Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "web/**"
      - "web_server.py"
      - ".github/workflows/rules-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "web/**"
      - "web_server.py"
      - ".github/workflows/rules-tests.yml"
  workflow_dispatch:

jobs:
  stdlib-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check website JavaScript syntax
        run: |
          node --check web/tile_art.js
          node --check web/sound.js
          node --check web/review.js
          node --check web/retry.js
          node --check web/history.js
          node --check web/quiz.js
          node --check web/quiz_history.js
          node --check web/four_player.js
          node --check web/match_playback.js
          node --check web/match_voice.js
          node --check web/match.js
          node --check web/navigation.js
          node --check web/match_stats.js
          node --check web/match_archives.js
          node --check web/ai_replay.js
          node --check web/ai_baseline.js
          node --check web/app.js
      - name: Smoke-test privacy-safe timed match playback
        run: node tests/test_match_playback.js
      - name: Smoke-test four-sided live match DOM and click-to-discard
        run: node tests/test_match_board_dom.js
      - name: Smoke-test SQLite match archive browser and comparison
        run: node tests/test_match_archive_dom.js
      - name: Smoke-test home module navigation without game reset
        run: node tests/test_module_navigation.js
      - name: Smoke-test verified match-stat SVG and outcome distribution
        run: node tests/test_match_stats_dom.js
      - name: Smoke-test public Mandarin match voice
        run: node tests/test_match_voice.js
      - name: Smoke-test controlled AI official-score laboratory DOM
        run: node tests/test_ai_controlled_dom.js
      - name: Smoke-test four-policy official-score baseline laboratory DOM
        run: node tests/test_ai_independent_scores_dom.js
      - name: Run no-dependency unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test Chinese discard demo
        run: python examples/analyze_hand.py
      - name: Smoke-test all four public training question modes
        run: |
          python examples/training_quiz.py --mode one_shanten --seed 9 --print-only
          python examples/training_quiz.py --mode tenpai_discard --seed 42 --print-only
          python examples/training_quiz.py --mode pure_suit_waits --seed 42 --print-only
          python examples/training_quiz.py --mode pure_suit_discard --seed 0 --print-only
      - name: Smoke-test higher difficulty question families
        run: |
          python examples/training_quiz.py --mode one_shanten --difficulty intermediate --seed 9 --print-only
          python examples/training_quiz.py --mode tenpai_discard --difficulty challenge --seed 42 --print-only
          python examples/training_quiz.py --mode pure_suit_waits --difficulty challenge --seed 12 --print-only
      - name: Smoke-test paired three-tier AI benchmark
        run: |
          python examples/benchmark_ai.py --seed-start 0 --seeds 32 --json-out /tmp/mahtrain-ai-benchmark.json --csv-out /tmp/mahtrain-ai-benchmark.csv
          python -c "import json; d=json.load(open('/tmp/mahtrain-ai-benchmark.json',encoding='utf8')); assert d['usable_positions'] >= 32; assert all(d['levels'][k]['decisions']==d['usable_positions'] for k in ('basic','advanced','challenge'))"
      - name: Archive paired AI benchmark inputs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-benchmark-python-${{ matrix.python-version }}
          path: |
            /tmp/mahtrain-ai-benchmark.json
            /tmp/mahtrain-ai-benchmark.csv
          if-no-files-found: warn
      - name: Smoke-test complete closed-loop AI tournament
        run: |
          python examples/tournament_ai.py --seed-start 11 --seeds 2 --json-out /tmp/mahtrain-ai-selfplay.json --csv-out /tmp/mahtrain-ai-selfplay.csv --seed-csv-out /tmp/mahtrain-ai-seed-clusters.csv
          python -c "import json; d=json.load(open('/tmp/mahtrain-ai-selfplay.json',encoding='utf8')); assert d['games']==6; assert all(d['levels'][k]['seat_exposures']==8 for k in ('basic','advanced','challenge')); assert all(x['physical_count']==108 for x in d['matches']); assert d['seed_analysis']['distinct_seed_count']==2; assert d['seed_analysis']['intervals'] is None"
      - name: Archive complete AI self-play logs and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-selfplay-python-${{ matrix.python-version }}
          path: |
            /tmp/mahtrain-ai-selfplay.json
            /tmp/mahtrain-ai-selfplay.csv
            /tmp/mahtrain-ai-seed-clusters.csv
          if-no-files-found: warn
      - name: Smoke-test four-policy independent-baseline tournament
        run: |
          python examples/benchmark_independent_ai.py --seed-start 11 --seeds 1 --json-out /tmp/mahtrain-ai-independent.json --csv-out /tmp/mahtrain-ai-independent.csv
          python -c "import json; d=json.load(open('/tmp/mahtrain-ai-independent.json',encoding='utf8')); assert d['games']==4; assert d['independent_shuffle_seeds']==1; assert all(d['levels'][x]['exposures']==4 for x in ('baseline','basic','advanced','challenge')); assert all(m['physical_count']==108 for m in d['matches']); assert d['intervals'] is None"
      - name: Archive independent baseline four-seat benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-independent-python-${{ matrix.python-version }}
          path: |
            /tmp/mahtrain-ai-independent.json
            /tmp/mahtrain-ai-independent.csv
          if-no-files-found: warn
      - name: Smoke-test five-policy ablation seat balance
        run: |
          python examples/benchmark_ablation_ai.py --seed-start 11 --seeds 1 --json-out /tmp/mahtrain-ai-ablation.json --csv-out /tmp/mahtrain-ai-ablation.csv --contrast-csv-out /tmp/mahtrain-ai-contrast.csv --pressure-csv-out /tmp/mahtrain-ai-pressure.csv --official-csv-out /tmp/mahtrain-ai-official.csv --html-out /tmp/mahtrain-ai-ablation.html
          python -c "import json; d=json.load(open('/tmp/mahtrain-ai-ablation.json',encoding='utf8')); assert d['games']==5; assert d['independent_shuffle_seeds']==1; assert len(d['opponents'])==5; assert all(d['levels'][x]['exposures']==4 for x in d['opponents']); assert all(m['physical_count']==108 for m in d['matches']); assert d['intervals'] is None; assert d['seed_analysis']['distinct_seed_count']==1; assert d['seed_analysis']['leave_one_seed_out'] is None; assert d['official_score_analysis']['requested_seeds']==1; assert d['official_score_analysis']['zero_sum']"
      - name: Archive five-policy ablation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-ablation-python-${{ matrix.python-version }}
          path: |
            /tmp/mahtrain-ai-ablation.json
            /tmp/mahtrain-ai-ablation.csv
            /tmp/mahtrain-ai-contrast.csv
            /tmp/mahtrain-ai-pressure.csv
            /tmp/mahtrain-ai-official.csv
            /tmp/mahtrain-ai-ablation.html
          if-no-files-found: warn
      - name: Smoke-test deterministic four-seat opening
        run: |
          python examples/four_player_opening_demo.py --seed 42 --turns 8
      - name: Smoke-test continuous solo training
        run: |
          python examples/solo_14_rounds.py --seed 17 --rounds 2 --auto
          python examples/solo_14_rounds.py --seed 17 --rounds 14 --auto
          python examples/solo_14_rounds.py --seed 17 --rounds 14 --auto --auto-kong

  five-seed-ablation-report:
    # Runs on PRs or manually, not on every main-branch push.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run five independent shuffle seeds and produce offline report
        run: |
          python examples/benchmark_ablation_ai.py --seed-start 30 --seeds 5 --json-out /tmp/mahtrain-m311.json --csv-out /tmp/mahtrain-m311-policy.csv --contrast-csv-out /tmp/mahtrain-m311-contrasts.csv --pressure-csv-out /tmp/mahtrain-m312-pressure.csv --official-csv-out /tmp/mahtrain-m333-official.csv --html-out /tmp/mahtrain-m311-report.html
      - name: Validate five seed clusters, seat exposures, intervals and HTML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/mahtrain-m311.json').read_text(encoding='utf8'))
          s=d['seed_analysis']
          assert d['games']==25 and d['independent_shuffle_seeds']==5
          assert s['distinct_seed_count']==5 and len(s['per_seed_differences'])==5
          assert d['interval_status']=='exploratory_only' and d['intervals']
          assert s['leave_one_seed_out'] is not None
          assert all(d['levels'][x]['exposures']==20 for x in d['opponents'])
          assert all(m['physical_count']==108 for m in d['matches'])
          assert all(sum(c.values())==5 for compare in s['direction_counts'].values() for c in compare.values())
          html=Path('/tmp/mahtrain-m311-report.html').read_text(encoding='utf8')
          assert '<svg role="img"' in html and '<script' not in html
          assert Path('/tmp/mahtrain-m311-contrasts.csv').is_file()
          p=d['pressure_diagnostics']
          assert set(p)=={'challenge','challenge_no_pressure'}
          for row in p.values():
              assert 0<=row['actual_changed']<=row['would_change']<=row['decisions']
              assert all(0<=row[k]<=row['decisions'] for k in ('effective_ties','pressure_present','pressure_discriminates'))
          assert Path('/tmp/mahtrain-m312-pressure.csv').is_file()
          assert '弱风险规则触发诊断' in html
          o=d['official_score_analysis']
          assert o['requested_seeds']==5 and o['zero_sum']
          assert o['valid_seeds']+o['excluded_seed_count']==5
          assert o['complete_games']==o['valid_seeds']*5
          assert all(x['seat_exposures']==o['valid_seeds']*4 for x in o['levels'].values())
          assert 'M3.33' in html and '正式积分/出场' in html
          assert Path('/tmp/mahtrain-m333-official.csv').is_file()
          PY
      - name: Archive five-seed HTML and structured reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-ablation-multiseed-py311
          path: |
            /tmp/mahtrain-m311.json
            /tmp/mahtrain-m311-policy.csv
            /tmp/mahtrain-m311-contrasts.csv
            /tmp/mahtrain-m312-pressure.csv
            /tmp/mahtrain-m333-official.csv
            /tmp/mahtrain-m311-report.html
          if-no-files-found: warn

  constructed-pressure-scenario-probe:
    # Separate job to keep deterministic constructed tests apart from
    # real 25-match ablation data. No pip dependencies, no private tiles.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe public-pung fixtures with the REAL shanten oracle
        run: |
          python examples/probe_pressure_scenarios.py --json-out /tmp/mahtrain-m313.json --csv-out /tmp/mahtrain-m313.csv
      - name: Assert one true policy flip and four meaningful negative controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/mahtrain-m313.json').read_text(encoding='utf8'))
          assert d['protocol']=='m313_physically_feasible_constructed_public_snapshot_v1'
          assert d['summary']['scenarios']==5
          assert d['summary']['choice_would_change']==1
          assert d['summary']['pressure_discriminates']>=2
          rows={x['scenario']:x for x in d['scenarios']}
          assert rows['two_same_suit_pungs']['actual_choice_changed']
          assert all(not x['choice_would_change'] for k,x in rows.items() if k!='two_same_suit_pungs')
          assert all(x['physically_feasible'] and x['known_physical_tiles']<=108 for x in rows.values())
          PY
      - name: Archive constructed scenario CSV and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pressure-scenarios-py311
          path: |
            /tmp/mahtrain-m313.json
            /tmp/mahtrain-m313.csv
          if-no-files-found: warn

  tenpai-calibration-pilot:
    # M3.56 offline diagnostic ONLY: never deploy coefficients to live AI.
    # True concealed hand labels exist transiently inside this CI runner,
    # but only aggregate out-of-seed Brier/reliability bins are exported.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Evaluate true tenpai on disjoint self-play shuffle seeds
        run: |
          python examples/evaluate_tenpai_calibration.py --seed-start 70 --train-seeds 2 --test-seeds 1 --stride 5 --json-out /tmp/mahtrain-m356.json
      - name: Validate privacy-safe report and calibration denominators
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/mahtrain-m356.json').read_text(encoding='utf8'))
          assert d['protocol']=='offline_tenpai_seed_split_pilot_v1'
          assert d['status']=='exploratory_only_no_online_deployment'
          assert set(d['train_seeds']).isdisjoint(d['test_seeds'])
          assert d['train_n']>0 and d['test_n']>0
          assert not d['contains_hidden_hands'] and not d['can_claim_improvement']
          for key in ('baseline','candidate'):
              row=d[key]
              assert row['n']==d['test_n']
              assert sum(x['count'] for x in row['reliability'])==row['n']
              assert 0<=row['brier']<=1 and row['log_loss']>=0
          assert 'raw_observations' not in d and 'opponent_hands' not in d
          PY
      - name: Archive aggregate calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-tenpai-calibration-pilot-py311
          path: /tmp/mahtrain-m356.json
          if-no-files-found: warn

  candidate-ron-calibration-pilot:
    # Research ONLY: evaluates true candidate-specific ron labels inside CI;
    # public-facing assets contain only seed-aggregated calibration metrics.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: M3.58 train on eight shuffle seeds and validate six disjoint seeds
        run: |
          python examples/evaluate_discard_ron_risk.py --seed-start 100 --train-seeds 8 --test-seeds 6 --stride 6 --json-out /tmp/mahtrain-m358.json
      - name: Verify candidate ron risk metrics and private hand exclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/mahtrain-m358.json').read_text(encoding='utf8'))
          assert r['protocol']=='offline_candidate_ron_seed_split_v1'
          assert r['status']=='exploratory_offline_no_model_deployment'
          assert len(r['train_seeds'])==8 and len(r['test_seeds'])==6
          assert set(r['train_seeds']).isdisjoint(r['test_seeds'])
          assert r['train_n']>0 and r['test_n']>0
          assert r['actionable_train_n']>0
          assert not r['contains_private_hands'] and not r['can_claim_generalization']
          s=r['stratified_validation']
          assert s['protocol']=='candidate_ron_public_strata_seed_cluster_v1'
          assert not s['has_hidden_hands'] and not s['row_level_predictions_exported']
          assert len(s['by_seed'])==6
          assert s['overall']['n']==r['test_n']
          assert s['strata']['candidate_rule']['ron_eligible']['n']==r['candidate']['actionable_n']
          assert sum(x['n'] for x in s['strata']['wall_stage'].values())==r['test_n']
          assert sum(x['n'] for x in s['strata']['target_public_melds'].values())==r['test_n']
          assert sum(x['n'] for x in s['strata']['candidate_rule'].values())==r['test_n']
          assert s['cluster_bootstrap_brier']['seed_clusters']==6
          assert len(s['cluster_bootstrap_brier']['bootstrap_95pct_range'])==2
          assert len(r['by_test_seed'])==6
          for key in ('baseline','candidate'):
              metrics=r[key]
              assert metrics['n']==r['test_n']
              assert metrics['ron_events']==r['test_ron_events']
              assert 0<=metrics['brier']<=1 and metrics['log_loss']>=0
              assert metrics['payout_multiplier_mse']>=0
              assert sum(b['n'] for b in metrics['reliability'])==r['test_n']
          forbidden=('raw_observations','opponent_hands','future_wall',
                     'candidate_tile','target_seat','hidden_waits','_hands')
          assert all(key not in r for key in forbidden)
          print('M3.58 public-stratified seed-cluster held-out validation: PASS')
          PY
      - name: Archive only aggregate candidate risk metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-candidate-ron-m358-stratified-py311
          path: /tmp/mahtrain-m358.json
          if-no-files-found: warn
